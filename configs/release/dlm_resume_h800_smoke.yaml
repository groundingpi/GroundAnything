entrypoint: dlm-train
native_config: configs/train/dlm_h800_resume.yaml
args: []
env:
  CUDA_VISIBLE_DEVICES: '0'
  OMP_NUM_THREADS: '4'
  GAM_DLM_FLEX_CUDAGRAPHS: '0'
  PYTORCH_ALLOC_CONF: expandable_segments:True
inputs: []
outputs:
- outputs/smoke/resume
distributed:
  nproc_per_node: 1
  nnodes: 1
  node_rank: 0
checkpoint:
  resume_from_checkpoint: outputs/smoke/train/checkpoint-1
