  logging_steps: 5
  save_strategy: steps
  save_steps: 0.05
  save_final_full_checkpoint: true
  dataloader_num_workers: 2
  seed: 42
  data_seed: 42
runtime:
  expected_nodes: 8
  expected_gpus_per_node: 8
  expected_world_size: 64
  image_max_token_num: 1024
  max_length: 4096
  max_joint_length: 8192
