mode: DLM
meta:
  experiment: dlm-specialist
  description: DLM specialist training configuration.
model:
  family: groundinganything_qwen3
  path: weights/base_model
  output_dir: outputs/specialist
data:
  sampling_manifest: data/specialist/sampling/manifest.json
  packing_manifest: data/specialist/packing/manifest.json
  sampled_rows: 29996394
training:
  num_train_epochs: 2
  per_device_train_batch_size: 32
  validated_large_batch_size: 32
  gradient_accumulation_steps: 1
  expected_global_batch_size: 2048
  learning_rate: 2.0e-05
  backbone_learning_rate: 2.0e-05
  projector_learning_rate: 2.0e-05
  vision_learning_rate: 2.0e-06
