output_type: generate_until
test_split: val
process_docs: !function utils.lmms_refcoco_process_docs
doc_to_visual: !function utils.lmms_refcoco_doc_to_visual
doc_to_text: !function utils.lmms_refcoco_doc_to_text
doc_to_target: "answer"
process_results: !function utils.lmms_refcoco_process_results
metric_list:
  - metric: recall_iou_50
    aggregation: !function utils.agg_recall
    higher_is_better: true
  - metric: recall_iou_95
    aggregation: !function utils.agg_recall
    higher_is_better: true
  - metric: recall_mean_iou
    aggregation: !function utils.agg_mean_iou
    higher_is_better: true
  - metric: precision_iou_50
    aggregation: !function utils.agg_precision
    higher_is_better: true
  - metric: precision_iou_95
    aggregation: !function utils.agg_precision
    higher_is_better: true
  - metric: precision_mean_iou
    aggregation: !function utils.agg_mean_iou
    higher_is_better: true
  - metric: f1_iou_50
    aggregation: !function utils.agg_f1
    higher_is_better: true
  - metric: f1_iou_95
    aggregation: !function utils.agg_f1
    higher_is_better: true
  - metric: F1mIoU
    aggregation: !function utils.agg_f1_mean_iou
    higher_is_better: true
metadata:
  version: '0.0'
