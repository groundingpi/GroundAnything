dataset_path: parquet
dataset_kwargs:
  data_files:
    context: ${EVAL_DATA:gam_robospatial_context}
task: "gam_robospatial_context"
test_split: context
output_type: generate_until
doc_to_visual: !function utils.robospatial_doc_to_visual
doc_to_text: !function utils.robospatial_context_doc_to_text
doc_to_target: "answer"
process_results: !function utils.robospatial_context_process_results
metric_list:
  - metric: score
    aggregation: !function utils.aggregate_score
    higher_is_better: true
metadata:
  - version: 0.0
