task: "gam_screenspot_pro"
dataset_path: "json"
dataset_name: "gui_grounding"
dataset_kwargs:
  data_files: "${EVAL_DATA:screenspot_pro}/annotations/*.json"
test_split: "train"
output_type: generate_until
process_docs: !function screenspot_utils.screenspot_pro_process_docs

doc_to_visual: !function screenspot_utils.screenspot_pro_doc_to_visual
doc_to_text: !function screenspot_utils.screenspot_pro_doc_to_text
doc_to_messages: !function screenspot_utils.screenspot_pro_doc_to_messages
doc_to_target: "bbox"
process_results: !function screenspot_utils.screenspot_pro_process_results

generation_kwargs:
  max_new_tokens: 512
  temperature: 0.0  # 必须严格为 0，对齐原始框架
  top_p: 1.0
  num_beams: 1

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
    system_prompt: "You are a GUI agent. You are given a task and a screenshot of the screen. You need to finish this task following instructions from users."
    dataset_path: "${EVAL_DATA:screenspot_pro}"
    inst_style: "instruction"  # instruction, action, description
    language: "en"  # en, cn
    gt_type: "positive"  # positive, negative

metric_list:
  - metric: action_acc
    aggregation: !function screenspot_utils.screenspot_pro_aggregate_results
    higher_is_better: true
  - metric: parse_error_rate
    aggregation: !function screenspot_utils.screenspot_pro_aggregate_parse_error_rate
    higher_is_better: false

metadata:
  version: 1.0
  description: "ScreenSpot-Pro: GUI Element Grounding task - Classified by platform (macos/windows/linux), application, language (en/cn), and instruction style (instruction/action/description)"
