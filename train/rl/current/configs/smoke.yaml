causal_justgrpo:
  training_budget: conversion_pilot
  algorithm: grpo
  policy_mode: causal
  rollout_mode: causal
  inference_mode: DecodeV4
  num_generations: 8
  policy_updates_per_rollout: 1
  temperature: 0.7
  top_p: 1.0
  top_k: 0
  max_completion_tokens: 1024
  clip_epsilon: 0.2
  reference_kl_beta: 0.0
  learning_rate: 2.0e-6
  scheduler: constant
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  total_optimizer_steps: 125
  save_steps: 25
  seed: 20260812
  per_device_prompt_batch_size: 1
  gradient_accumulation_steps: 1
  bf16: true
  deepspeed_zero_stage: 1
  freeze_vision_encoder: true
  freeze_projector: false
